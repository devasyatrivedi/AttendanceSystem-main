<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Attendance System</title>
  <meta name="description" content="AI-powered smart attendance system for modern educational institutions. Face recognition, real-time tracking, and automated reports.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      overflow: hidden;
      position: relative;
    }

    /* Animated gradient background */
    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: floatOrb 8s ease-in-out infinite;
    }
    .orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #6366f1, #4f46e5);
      top: -100px; left: -100px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #8b5cf6, #7c3aed);
      bottom: -100px; right: -50px;
      animation-delay: -3s;
    }
    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #3b82f6, #2563eb);
      bottom: 20%; left: 30%;
      animation-delay: -5s;
    }
    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* Grid pattern overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 0;
    }

    /* Card */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 3rem 2.75rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 40px 80px rgba(0,0,0,0.4);
      text-align: center;
      animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo icon */
    .logo-box {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-radius: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: white;
      margin-bottom: 1.75rem;
      box-shadow: 0 20px 40px -10px rgba(99,102,241,0.6);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 20px 40px -10px rgba(99,102,241,0.6); }
      50% { box-shadow: 0 25px 50px -10px rgba(99,102,241,0.8); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(99,102,241,0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 9999px;
      padding: 0.3rem 0.85rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      margin-bottom: 1.25rem;
    }
    .badge span { width: 6px; height: 6px; border-radius: 50%; background: #6366f1; animation: blink 1.5s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    h1 {
      font-size: 2rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .portal-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .portal-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .portal-btn:hover::before { opacity: 1; }

    .portal-btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      box-shadow: 0 8px 20px -5px rgba(99,102,241,0.5);
    }
    .portal-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -5px rgba(99,102,241,0.65);
    }

    .portal-btn-ghost {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .portal-btn-ghost:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.2);
    }

    .portal-btn-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .icon-primary { background: rgba(255,255,255,0.2); color: white; }
    .icon-ghost { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }

    .portal-btn-text { text-align: left; flex: 1; }
    .portal-btn-label { display: block; font-weight: 700; }
    .portal-btn-desc { display: block; font-size: 0.75rem; font-weight: 500; opacity: 0.65; }
    .portal-btn-arrow { margin-left: auto; opacity: 0.5; font-size: 0.8rem; }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: rgba(255,255,255,0.2);
      font-size: 0.75rem;
    }
    .divider hr { flex: 1; border: none; border-top: 1px solid rgba(255,255,255,0.1); }

    .footer-links {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.35);
    }
    .footer-links a {
      color: #a5b4fc;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-links a:hover { color: #c7d2fe; }

    /* Feature chips */
    .features {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .feat-chip {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.45);
      border-radius: 9999px;
      padding: 0.25rem 0.75rem;
      font-size: 0.7rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .feat-chip i { font-size: 0.65rem; }
  </style>
</head>
<body>

  <!-- Animated background -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Main card -->
  <div class="card">

    <div class="logo-box">
      <i class="fas fa-layer-group"></i>
    </div>

    <div class="badge">
      <span></span> AI-Powered Platform
    </div>

    <h1>Smart Attendance<br>System</h1>
    <p class="subtitle">Modern attendance tracking with face recognition, real-time dashboards, and automated reports.</p>

    <div class="features">
      <div class="feat-chip"><i class="fas fa-camera"></i> Face Recognition</div>
      <div class="feat-chip"><i class="fas fa-bolt"></i> Real-time</div>
      <div class="feat-chip"><i class="fas fa-envelope"></i> Auto Alerts</div>
    </div>

    <div class="btn-group">
      <a href="teacher/login.html" class="portal-btn portal-btn-primary">
        <div class="portal-btn-icon icon-primary"><i class="fas fa-user-shield"></i></div>
        <div class="portal-btn-text">
          <span class="portal-btn-label">Administrator Portal</span>
          <span class="portal-btn-desc">Teacher &amp; admin access</span>
        </div>
        <i class="fas fa-chevron-right portal-btn-arrow"></i>
      </a>

      <a href="student/login.html" class="portal-btn portal-btn-ghost">
        <div class="portal-btn-icon icon-ghost"><i class="fas fa-user-graduate"></i></div>
        <div class="portal-btn-text">
          <span class="portal-btn-label">Student Portal</span>
          <span class="portal-btn-desc">View your attendance</span>
        </div>
        <i class="fas fa-chevron-right portal-btn-arrow"></i>
      </a>
    </div>

    <div class="footer-links">
      New student? <a href="student/register.html">Create an account</a>
    </div>

  </div>

</body>
</html>
